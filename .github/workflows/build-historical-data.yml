name: Build historical election rankings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_historical_data.py'
      - '.github/workflows/build-historical-data.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact historical files
        env:
          HISTORY_TOP_N: '300'
        run: python scripts/build_historical_data.py
      - name: Commit generated historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No historical data changes"
            exit 0
          fi
          git commit -m "Atualiza histórico eleitoral 2012 a 2024"
          git push
